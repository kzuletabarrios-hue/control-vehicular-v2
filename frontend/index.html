  const [frecuenteInfo,setFrecuenteInfo] = useState(null); // {estado:'encontrado'|'inactivo'|'nuevo', data:obj}
  const [saveFrModal,setSaveFrModal]     = useState(false);
  const [frDraft,setFrDraft]             = useState({cedula:'',nombre_conductor:'',empresa_principal:'',tipo_vehiculo:''});
  const tiposVehiculo = ['Camión','Camioneta','Moto','Furgón','Tractomula','Otro'];
  const tiposCarga = ['Seca','Refrigerada','Mixta'];
  const formatosCarga = ['Paletizada','Granel','Mixta'];
  const manejosCarga = ['Conductor con certificado de montacargas','Reciservicios','Ercol','Operador logístico externo'];
  // Patrón observado en datos históricos (no una regla formal): Refrigerada
  // suele descargar en muelles 1-6, Seca en 13-18. Mixta no tiene patrón
  // claro, por eso no aparece acá -- ver aviso no bloqueante más abajo.
  const MUELLES_HABITUALES = {Refrigerada:[1,6], Seca:[13,18]};

  /* ── EDIT FORM STATE ── */
  const emptyF = {fecha:today(),placa_vehiculo:'',nombre_conductor:'',tipo_documento:'CC',cedula_conductor:'',telefono_conductor:'',tipo_vehiculo:'',hora_ingreso:ahoraHora(),hora_ingreso_confirmado:'',hora_salida:'',muelle_descargue:'',fecha_pago_arl:'',epp_cumple:'',tipo_carga:'',formato_carga:'',cantidad_pallets:'',manejo_carga:'',observaciones:'',foto_url:null};
  const [form,setForm]               = useState(emptyF);
  const [formOrdenes,setFormOrdenes] = useState([]);
  const [formOrd,setFormOrd]         = useState({empresa:'',carga_compartida:false,actividad_a_desarrollar:'',dependencia_autoriza:''});
  const [addingOrd,setAddingOrd]     = useState(false);

  /* ── NUEVO INGRESO STATE ── */
  const emptyVeh = ()=>({fecha:today(),placa_vehiculo:'',tipo_documento:'CC',cedula_conductor:'',nombre_conductor:'',telefono_conductor:'',tipo_vehiculo:'',hora_ingreso:ahoraHora(),hora_cita:'',muelle_descargue:'',fecha_pago_arl:'',epp_cumple:'',tipo_carga:'',formato_carga:'',cantidad_pallets:'',manejo_carga:'',tipos_logistica_inversa:null,observaciones:'',foto_url:null});
  const emptyOrd = {empresa:'',numero_orden_compra:'',carga_compartida:false,actividad_a_desarrollar:'',dependencia_autoriza:'',cita_id:null};
  const [vehiculoForm,setVehiculoForm]     = useState(emptyVeh);
  const [ordenes,setOrdenes]               = useState([]);
  const [ordenDraft,setOrdenDraft]         = useState(emptyOrd);
  const [ordenEditingIdx,setOrdenEditingIdx] = useState(null);
  const [citaOrdenInfo,setCitaOrdenInfo]   = useState(null); // {estado:'encontrado'|'no_encontrado'}

  /* Citas de hoy sin llegada registrada (GET /proveedores/citas/alertas).
     Alimenta la pestaña "📅 Con cita" -- render mínimo a propósito, Laura
     diseña la card final después, esto solo deja el dato disponible. */
  const [citasAlertas,setCitasAlertas] = useState({pendientes:[],por_vencer:[],atrasadas:[]});

  /* ── CARGA DIARIA DE CITAS (WMS) ──
     Sin fecha global: "Fecha Ejec." viene por fila en el archivo, el backend
     calcula las fechas distintas presentes y reemplaza cada una. */
  const [citasModal,setCitasModal]     = useState(false);
  const [citasTab,setCitasTab]         = useState('subir'); // 'subir' | 'ver' -- dos usos distintos del mismo modal (ver comentario en el render)
  const [citasRows,setCitasRows]       = useState([]);
  const [citasFileName,setCitasFileN]  = useState('');
  const [citasLoading,setCitasLoading] = useState(false);
  const [citasResult,setCitasResult]   = useState(null);
  const [citasErr,setCitasErr]         = useState('');

  /* ── LISTA DE CITAS DEL DÍA (edición manual de hora) ──
     GET /proveedores/citas?fecha=... -- a diferencia del import (que ya no
     tiene selector de fecha porque "Fecha Ejec." viaja por fila del
     archivo), acá SÍ hace falta un selector: se están consultando citas
     YA guardadas en la BD, no un archivo nuevo. Render mínimo a propósito
     -- Laura lo rediseña después, esto solo conecta el dato. */
  const [citasDiaFecha,setCitasDiaFecha]     = useState(today());
  const [citasDiaItems,setCitasDiaItems]     = useState([]);
  const [citasDiaLoading,setCitasDiaLoading] = useState(false);
  const [citasDiaErr,setCitasDiaErr]         = useState('');
  const [citaEditId,setCitaEditId]           = useState(null); // id de citas_programadas en edición
  const [citaEditForm,setCitaEditForm]       = useState({hora_cita_inicio:'',hora_cita_fin:'',motivo:''});
  const [citaEditSaving,setCitaEditSaving]   = useState(false);
  const [citaEditErr,setCitaEditErr]         = useState('');

  const load = useCallback(()=>{
    api.get('/proveedores').then(r=>setRecords(r.items||r)).catch(()=>setAlert({type:'err',msg:'Error cargando datos'})).finally(()=>setLoading(false));
    // Mismo ciclo de polling que /proveedores (no se agrega un segundo
    // intervalo): citas de hoy sin llegada registrada, para avisarle al
    // guarda que llame al proveedor.
    api.get('/proveedores/citas/alertas').then(setCitasAlertas).catch(()=>{});
  },[]);
  // Proveedores es operativa (alerta de hora de cita): 1 min y se pausa en
  // background.
  useVisibilityPolling(load, 60000, [load]);

  // Suena una alerta cuando a un proveedor por confirmar le falten ≤5 min para
  // su hora de cita (declarada por el conductor). Una sola vez por registro.
  const avisados5min = useRef(new Set());
  useEffect(()=>{
    const pendientesIds = new Set();
    records.forEach(r=>{
      if(r.estado_confirmacion!=='pendiente' || !r.hora_cita) return;
      pendientesIds.add(r.id);
      const [ch,cm] = r.hora_cita.split(':').map(Number);
      const [ah,am] = ahoraHora().split(':').map(Number);
      const diff = (ch*60+cm) - (ah*60+am);
      if(diff>=0 && diff<=5 && !avisados5min.current.has(r.id)){
        avisados5min.current.add(r.id);
        playAlertSound();
      }
    });
    // Limpia ids que ya no aplican (confirmados o fuera de la lista) para no
    // acumular memoria indefinidamente en un turno largo.
    avisados5min.current.forEach(id=>{ if(!pendientesIds.has(id)) avisados5min.current.delete(id); });
  },[records]);

  // Suena cada 7 min mientras un pendiente siga atrasado en su hora de cita
  // (diff<0) y sin marcar WPS. Independiente de avisados5min (ese es
  // proactivo/una vez; este es reactivo/repetido). Un timestamp por id, no un
  // booleano, para poder re-disparar.
  const avisadosAtraso = useRef(new Map()); // id -> ms del último aviso
  useEffect(()=>{
    const activosIds = new Set();
    const ahoraMs = Date.now();
    records.forEach(r=>{
      if(r.estado_confirmacion!=='pendiente' || !r.hora_cita) return;
      const [ch,cm] = r.hora_cita.split(':').map(Number);
      const [ah,am] = ahoraHora().split(':').map(Number);
      const diff = (ch*60+cm) - (ah*60+am);
      if(diff<0){
        activosIds.add(r.id);
        const ultimo = avisadosAtraso.current.get(r.id);
        if(ultimo==null || ahoraMs-ultimo >= 7*60*1000){
          avisadosAtraso.current.set(r.id, ahoraMs);
          playAlertSound();
        }
      }
    });
    avisadosAtraso.current.forEach((_,id)=>{ if(!activosIds.has(id)) avisadosAtraso.current.delete(id); });
  },[records]);

  useEffect(()=>{
    api.get('/maestros/proveedores').then(r=>setBdProv(Array.isArray(r)?r:(r.items||[]))).catch(()=>{});
  },[]);

  // muelle es opcional: si viene, viaja como muelle_descargue en el mismo
  // PUT que confirma (ver ConfirmarMuelleSheet, tablero que abre el botón
  // "Confirmar"). Sin muelle, el comportamiento es exactamente el de
  // siempre -- confirma sin tocar el muelle.
  const confirmarIngreso = async(id,muelle)=>{
    try{
      const body = muelle?{muelle_descargue:String(muelle)}:{};
      await api.put(`/proveedores/${id}/confirmar`,body);
      setAlert({type:'ok',msg:muelle?`Ingreso confirmado — muelle ${muelle}`:'Ingreso confirmado'});
      load();
    }catch(e){setAlert({type:'err',msg:'Error: '+e.message});}
  };

  const marcarWps = async(id)=>{
    try{
      await api.put(`/proveedores/${id}/marcar-wps`,{});
      setAlert({type:'ok',msg:'Ingreso a WPS marcado'});
      load();
    }catch(e){setAlert({type:'err',msg:'Error: '+e.message});}
  };

  /* ── QR de ingreso (kiosco de portería) ── */
  const [qrImgUrl,setQrImgUrl] = useState(null);
  const [qrError,setQrError]   = useState(null);
  // Ref (en vez de la `view` capturada en el closure) para descartar una
  // respuesta que llegue tarde después de que el usuario ya salió de esta
  // vista (o volvió a entrar y ya hay un fetch más nuevo en curso).
  const viewRef = useRef(view);
  viewRef.current = view;
  const fetchQr = useCallback(()=>{
    fetch(`${API_BASE}/proveedores/qr-imagen`,{headers:{Authorization:'Bearer '+getToken()}})
      .then(r=>{ if(!r.ok) throw new Error('No se pudo generar el QR'); return r.text(); })
      .then(svg=>{ if(viewRef.current==='qr'){ setQrError(null); setQrImgUrl('data:image/svg+xml;utf8,'+encodeURIComponent(svg)); } })
      .catch(e=>{ if(viewRef.current==='qr') setQrError(e.message); });
  },[]);
  // El QR expira a los 5 min (QR_INGRESO_TTL_SEG en el backend); 90s deja

  // lista de errores 422 de Pydantic) a un texto legible -- mismo criterio
  // de parseo que textoErrorAnulacion.
  // Nota: se declara aquí (junto al resto de hooks del componente, arriba de
  // cualquier return condicional) porque cargarCitasDia -- un hook -- la
  // referencia; si quedara declarada más abajo, el closure de cargarCitasDia
  // podría capturarla antes de su inicialización (TDZ) en un render que
  // retorna temprano (view 'qr'/'form'/'batch').
  const _textoErrorCita = ex => {
    let m = ex.message || 'Error';
    try{
      const parsed = JSON.parse(m);
      if(typeof parsed.detail === 'string') m = parsed.detail;
      else if(Array.isArray(parsed.detail) && parsed.detail[0]) m = String(parsed.detail[0].msg||'').replace(/^Value error,\s*/i,'');
    }catch(_){}
    return m;
  };

  // returns de las vistas 'qr'/'form').
  const cargarCitasDia = useCallback(()=>{

      .then(r=>setCitasDiaItems(r.items||[]))
      .catch(ex=>setCitasDiaErr(_textoErrorCita(ex)))

    // 1. Buscar en catálogo de frecuentes

      const frecuentes = await api.get(`/maestros/conductores-frecuentes?cedula=${encodeURIComponent(cedula)}`);
      const flist = Array.isArray(frecuentes)?frecuentes:(frecuentes.items||[]);
      const fm = flist.find(c=>String(c.cedula)===String(cedula));
      if(fm){
        setter(p=>({...p,
          nombre_conductor:fm.nombre_conductor||p.nombre_conductor,
          tipo_vehiculo:p.tipo_vehiculo||fm.tipo_vehiculo||'',
          telefono_conductor:p.telefono_conductor||fm.telefono||'',
        }));
        if(!fm.activo){
          setFrecuenteInfo({estado:'inactivo',data:fm});
        } else {
          setFrecuenteInfo({estado:'encontrado',data:fm});
          if(fm.empresa_principal) setOrdenDraft(p=>({...p,empresa:p.empresa||fm.empresa_principal}));
        }
        return;
      }
    }catch(_){}
    // 2. Fallback: conductores internos
    try{
      const res = await api.get('/conductores?activo=true&limit=300');
      const list = Array.isArray(res)?res:(res.items||[]);
      const m = list.find(c=>String(c.cedula)===String(cedula));
      if(m) setter(p=>({...p,nombre_conductor:m.nombre_completo||m.nombre||p.nombre_conductor}));
    }catch(e){}
    setFrecuenteInfo(p=>p||{estado:'nuevo',data:null});
  };

     (mismo CHECK/regex ^4\d{9}$ que ya usa proveedores_ordenes en el
     autorregistro QR del conductor). El guarda puede teclear el número tal
     cual aparece en el WMS ("PT - 4602898240 - 2"); se extrae el patrón de
     10 dígitos de adentro del texto (no se asume posición fija) antes de
     comparar contra la BD -- comparar el texto crudo nunca haría match. */
  const _extraerNumeroOrden = (v)=>{
    const s = String(v||'').trim();
    if(!s) return '';
    const grupos = s.match(/\d+/g) || [];
    const encontrado = grupos.find(g=>g.length===10 && g[0]==='4');
    return encontrado || '';
  };

  const buscarCitaOrden = async(valor)=>{
    const numero = _extraerNumeroOrden(valor);
    if(!numero){ setCitaOrdenInfo(null); return; }
    try{
      const res = await api.get(`/proveedores/citas/buscar?fecha=${encodeURIComponent(vehiculoForm.fecha)}&numero_orden_compra=${encodeURIComponent(numero)}`);

  /* ── CARGA DIARIA DE CITAS (WMS) — helpers ──
     El parseo del Excel se hace en el navegador con SheetJS (mismo patrón
     que CargaMasivaPage) y se manda al backend ya como JSON. Columnas reales
     del export ("Fecha Ejec.", "O. Compra", "Proveedor", "F. Temporal", y
     desde Fase 5.2 también código de proveedor, flujo, descripción de
     carga, fecha del documento de compra y cantidad de pallets -- paridad
     con cargar_archivo() de citas-muelles-cedi-r10); matching de
     encabezados tolerante a mayúsculas/espacios porque el archivo .xls
     trae variaciones de codificación en otras columnas que no usamos.
     "Transportador" no se envía: citas_programadas (tabla real, compartida
     con una app externa) no tiene columna para guardarlo.
     "Fecha Ejec." viene por fila (YYYYMMDD) -- un mismo archivo puede traer
     más de un día, así que la fecha ya NO se elige a mano, se calcula por
     fila y el backend hace DELETE+INSERT por cada fecha distinta que
     encuentre entre las filas válidas.
     IMPORTANTE: NO se activa `cellDates:true` en XLSX.read (a diferencia
     de citas-muelles-cedi-r10) -- "Fecha Ejec." ya funciona en producción
     asumiendo que la celda llega como texto/numero YYYYMMDD, no como Date;
     activar cellDates globalmente arriesgaba romper ese parseo que ya
     funciona. Por eso "Fecha doc." (fecha_documento_compra) se normaliza
     con el mismo criterio YYYYMMDD/YYYY-MM-DD por texto en vez de asumir
     un objeto Date -- si no calza ningún formato reconocido se manda tal
     cual y el backend la descarta a NULL sin tumbar la fila (ver
     _fecha_documento_opcional en proveedores.py). */
  const _citasFindVal = (row, variantes) => {
    for(const k of Object.keys(row)){
      const kk = String(k).toLowerCase().trim();
      if(variantes.some(v=>kk===v||kk.startsWith(v))) return row[k];
    }
    return '';
  };
  const _citasNormalizarFecha = v => {
    const s = String(v||'').trim();
    if(/^\d{8}$/.test(s)) return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    return s;
  };

  const handleCitasFile = e => {
    const file = e.target.files[0];
    if(!file) return;
    if(!window.XLSX){ setCitasErr('Librería Excel no cargada, recarga la página'); return; }
    setCitasFileN(file.name); setCitasResult(null); setCitasErr('');
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const wb = window.XLSX.read(ev.target.result,{type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const raw = window.XLSX.utils.sheet_to_json(ws,{defval:''});
        const parsed = raw.map(row=>{
          const fechaEjec = String(_citasFindVal(row,['fecha ejec.','fecha ejec','fechaejec'])||'').trim();
          const fecha = /^\d{8}$/.test(fechaEjec) ? `${fechaEjec.slice(0,4)}-${fechaEjec.slice(4,6)}-${fechaEjec.slice(6,8)}` : '';
          return {
            fecha,
            numero_orden_compra: _extraerNumeroOrden(_citasFindVal(row,['o. compra','o.compra','orden compra','orden de compra'])),
            proveedor: String(_citasFindVal(row,['proveedor'])||'').trim(),
            franja_horaria_texto: String(_citasFindVal(row,['f. temporal','f.temporal','franja horaria','franja'])||'').trim(),
            // Campos ampliados en Fase 5.2 (paridad con cargar_archivo() de
            // citas-muelles-cedi-r10) -- todos opcionales: si no calzan con
            // ningún encabezado del archivo, el backend los guarda como NULL
            // sin descartar la fila (a diferencia de los 4 campos de arriba,
            // que sí son obligatorios para que la fila sea válida).
            proveedor_codigo: String(_citasFindVal(row,['proveedor_codigo','codigo proveedor','código proveedor','cod. proveedor','cod proveedor','numero de cuenta del proveedor','número de cuenta del proveedor'])||'').trim(),
            flujo: String(_citasFindVal(row,['flujo'])||'').trim(),
            descripcion_carga: String(_citasFindVal(row,['descripcion_carga','descripcion','descripción','descripcion carga','descripción carga','desc. carga'])||'').trim(),
            fecha_documento_compra: _citasNormalizarFecha(_citasFindVal(row,['fecha_documento_compra','fecha doc.','fecha doc','fecha documento compra','fecha docto','fecha documento'])),
            cantidad_pallets: String(_citasFindVal(row,['cantidad_pallets','ekko-yypal','ekko yypal','pallets','cantidad pallets','cantidad de pallets'])||'').trim(),
          };
        }).filter(r=>r.numero_orden_compra && r.proveedor);
        setCitasRows(parsed);
        if(parsed.length===0){
          setCitasErr('No se encontraron filas válidas. Revisa que el archivo tenga las columnas "O. Compra" (con un número de 10 dígitos que empiece en 4) y "Proveedor".');
        }
      }catch(ex){ setCitasErr('Error al leer archivo: '+ex.message); }
    };
    reader.readAsArrayBuffer(file);
    e.target.value='';
  };

  const handleCitasImport = async()=>{
    if(!citasRows.length) return setCitasErr('No hay datos para importar');
    setCitasLoading(true); setCitasErr(''); setCitasResult(null);
    try{
      const res = await api.post('/proveedores/citas/importar',{
        nombre_archivo:citasFileName,
        filas:citasRows,
      });
      setCitasResult(res);
      setCitasRows([]); setCitasFileN('');
      load(); // por si hay ordenes ya en pantalla que ahora pueden autocompletarse
      if(res.fechas?.includes(citasDiaFecha)) cargarCitasDia(); // refresca la lista si el import tocó la fecha que se está viendo
    }catch(ex){
      let m=ex.message||'Error'; try{m=JSON.parse(m).detail||m;}catch{}
      setCitasErr(m);
    }finally{ setCitasLoading(false); }
  };

function BdTiendasTab(){
  const [records,setRecords] = useState([]);

  const [saving,setSaving]   = useState(false);
  const [alert,setAlert]     = useState(null);
  const [confirm,setConfirm] = useState(null);
  const emptyF = {codigo:'',name:'',direccion:''};
  const [form,setForm] = useState(emptyF);
  const [editingId,setEditingId] = useState(null);

  const load = useCallback(()=>{
    setLoading(true);
    api.get('/maestros/distribucion').then(setRecords).catch(()=>setAlert({type:'err',msg:'Error cargando datos'})).finally(()=>setLoading(false));
  },[]);
  useEffect(()=>load(),[load]);

  const handleCodigo = (val) => {
    setForm(p=>({...p,codigo:val}));
    const existente = records.find(r=>String(r.codigo)===String(val).trim() && val.trim()!=='');
    if(existente){
      setForm({codigo:String(existente.codigo),name:existente.name,direccion:existente.direccion||''});
      setEditingId(existente.id);
    } else if(editingId){
      setEditingId(null);
    }
  };

  const handleSave = async()=>{
    if(!form.name.trim()) return setAlert({type:'err',msg:'El nombre de la tienda es requerido'});
    setSaving(true);
    try{
      const body = {codigo:form.codigo.trim()||null, name:form.name.trim(), direccion:form.direccion.trim()||null};
      if(editingId) await api.put(`/maestros/distribucion/${editingId}`,body);
      else await api.post('/maestros/distribucion',body);
      setAlert({type:'ok',msg:editingId?'Tienda actualizada':'Tienda agregada'});
      setForm(emptyF);setEditingId(null);load();
    }catch(e){setAlert({type:'err',msg:'Error: '+e.message});}
    finally{setSaving(false);}
  };

  return h('div',{style:{display:'flex',flexDirection:'column',flex:1,overflow:'hidden'}},
    h('div',{className:'scroll-body',style:{padding:'10px 14px'}},
      alert&&h(Alert,{...alert,onClose:()=>setAlert(null)}),
      h('div',{className:'fcard'},
        h('p',{className:'sec-ttl'},h(Ico,{n:'plus',s:12}),editingId?' Editar tienda':' Nueva tienda'),

          h('div',{className:'fg'},

            h('input',{type:'text',value:form.codigo,onChange:e=>handleCodigo(e.target.value),placeholder:'1025'})
          ),
          h('div',{className:'fg'},
            h('label',null,'Nombre'),
            h('input',{type:'text',value:form.name,onChange:e=>setForm(p=>({...p,name:e.target.value})),placeholder:'Nombre de la tienda'})
          )
        ),
        h('div',{className:'fg'},
          h('label',null,'Dirección'),
          h('input',{type:'text',value:form.direccion,onChange:e=>setForm(p=>({...p,direccion:e.target.value})),placeholder:'Dirección',onKeyDown:e=>e.key==='Enter'&&handleSave()})
        ),
        h('div',{style:{display:'flex',gap:8,justifyContent:'flex-end'}},

/* ── QR SCANNER ── */
function QRScanner({onScan,onClose}){
  const scannerRef = useRef(null);
  const activeRef  = useRef(true);
  const runningRef = useRef(false);
  const [error,setError] = useState(null);

  const safeStop = ()=>{
    if(!runningRef.current || !scannerRef.current) return Promise.resolve();
    runningRef.current = false;
    try{ return scannerRef.current.stop().catch(()=>{}); }
    catch(err){ return Promise.resolve(); }
  };

  const reportError = (err)=>{
    if(!activeRef.current) return;
    const msg = (err && (err.message||err.name)) || String(err);
    setError(
      /NotAllowedError|Permission/i.test(msg)
        ? 'Permiso de cámara denegado. Habilítalo en los ajustes del navegador y vuelve a intentar.'
        : /NotFoundError/i.test(msg)
          ? 'No se encontró ninguna cámara en este dispositivo.'
          : /NotSupportedError|secure context/i.test(msg)
            ? 'Este navegador no soporta acceso a la cámara en esta conexión. Asegúrate de usar https.'
            : 'No se pudo abrir la cámara: '+msg
    );
  };

  useEffect(()=>{
    activeRef.current = true;
    try{
      const Lib = window.Html5Qrcode;
      if(!Lib){ setError('No se pudo cargar el escáner. Verifica tu conexión a internet y vuelve a intentar.'); return; }
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        setError('Este navegador no permite acceso a la cámara. Prueba con Chrome o Safari actualizado.');
        return;
      }
      const scanner = new Lib('qr-scan-region');
      scannerRef.current = scanner;
      scanner.start(
        {facingMode:'environment'},
        {fps:10,qrbox:{width:240,height:240}},
        (text)=>{
          if(!activeRef.current) return;
          safeStop().finally(()=>{ if(activeRef.current) onScan(text); });
        },
        ()=>{}
      ).then(()=>{ runningRef.current = true; }).catch(reportError);
    }catch(err){
      reportError(err);
    }
    return ()=>{
      activeRef.current = false;
      safeStop();
    };
  },[]);

  return h('div',{style:{position:'fixed',inset:0,background:'#000',zIndex:300,display:'flex',flexDirection:'column'}},
    h('div',{style:{padding:'14px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',background:'rgba(0,0,0,0.85)',flexShrink:0}},
      h('span',{style:{color:'#fff',fontWeight:700,fontSize:14}},h(Ico,{n:'qrCode',s:16}),' Apunta al QR del punto'),
      h('button',{onClick:()=>{ safeStop(); onClose(); },
        style:{background:'none',border:'none',color:'#fff',cursor:'pointer',padding:4}},
        h(Ico,{n:'x',s:24})
      )
    ),
    error
      ? h('div',{style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px',gap:14}},
          h(Ico,{n:'alert',s:36,style:{color:'#f59e0b'}}),
          h('p',{style:{color:'#fff',fontSize:13,textAlign:'center',maxWidth:280}},error),
          h('button',{className:'btn-primary',onClick:onClose,style:{padding:'8px 20px'}},'Volver')
        )
      : h('div',{id:'qr-scan-region',style:{flex:1}}),
    !error&&h('div',{style:{padding:'12px 16px',background:'rgba(0,0,0,0.85)',textAlign:'center',flexShrink:0}},
      h('p',{style:{color:'rgba(255,255,255,0.65)',fontSize:12}},'Centra el código QR en el recuadro')
    )
  );
}

/* ── PANEL RONDERO (supervisión) ── */
function RondaPanelPage({user}){
  const [vista,setVista]     = useState('hoy');
  const [data,setData]       = useState([]);
  const [semana,setSemana]   = useState(null);
  const [loading,setLoading] = useState(true);
  const [alert,setAlert]     = useState(null);
  const [confirmCancelar,setConfirmCancelar] = useState(null); // {id, nombre}

  const load = useCallback(()=>{
    api.get('/rondas/panel').then(r=>setData(Array.isArray(r)?r:[])).catch(()=>{}).finally(()=>setLoading(false));
  },[]);
  // Panel de rondas es de las pantallas más operativas: 1 min y se pausa en
  // background.
  useVisibilityPolling(load, 60000, [load]);

  const handleCancelarAdmin = async()=>{
    if(!confirmCancelar) return;
    try{
      await api.post(`/rondas/ciclo/${confirmCancelar.id}/cancelar-admin`,{});
      setAlert({type:'ok',msg:'Ronda cancelada'});
      setConfirmCancelar(null);
      load();
    }catch(e){
      let msg=e.message; try{msg=JSON.parse(msg).detail||msg;}catch{}
      setAlert({type:'err',msg});
    }
  };

  useEffect(()=>{
    if(vista!=='semana') return;
    setLoading(true);
    api.get('/rondas/reporte-semanal').then(r=>setSemana(r)).catch(()=>{}).finally(()=>setLoading(false));
  },[vista]);

  const pillCumplimiento = (pct)=>{
    if(pct==null) return h('span',{className:'pill pill-slate'},'Sin datos');
    if(pct>=90) return h('span',{className:'pill pill-green'},pct+'%');
    if(pct>=70) return h('span',{className:'pill pill-amber'},pct+'%');
    return h('span',{className:'pill pill-red'},pct+'%');
  };

  return h('div',{style:{display:'flex',flexDirection:'column',flex:1,overflow:'hidden'}},
    h('div',{className:'header'},
      h('div',{className:'header-inner'},
        h('div',{className:'header-brand'},h('h1',null,'Panel Rondero'),h('span',null,vista==='hoy'?'Seguimiento en vivo':'Cumplimiento semanal'))
      )
    ),
    h('div',{style:{display:'flex',gap:6,alignItems:'center',padding:'8px 14px 0',background:'var(--white)',borderBottom:'1px solid var(--border)'}},
      h('button',{onClick:()=>setVista('hoy'),style:{padding:'5px 10px',borderRadius:20,fontSize:11,fontWeight:600,cursor:'pointer',fontFamily:'inherit',border:'1.5px solid',background:vista==='hoy'?'var(--navy)':'transparent',color:vista==='hoy'?'#fff':'var(--slate)',borderColor:vista==='hoy'?'var(--navy)':'var(--border)',marginBottom:8}},'Hoy'),
      h('button',{onClick:()=>setVista('semana'),style:{padding:'5px 10px',borderRadius:20,fontSize:11,fontWeight:600,cursor:'pointer',fontFamily:'inherit',border:'1.5px solid',background:vista==='semana'?'var(--navy)':'transparent',color:vista==='semana'?'#fff':'var(--slate)',borderColor:vista==='semana'?'var(--navy)':'var(--border)',marginBottom:8}},'Semana')
    ),
    h('div',{className:'scroll-body',style:{padding:'12px 14px'}},
      alert&&h(Alert,{...alert,onClose:()=>setAlert(null)}),
      loading?h(LoadingDots):
      vista==='hoy'?(
        data.length===0?h('div',{className:'empty'},h(Ico,{n:'clock',s:44}),h('p',null,'No hay recorredores externos activos')):
        data.map(d=>h('div',{key:d.recorredor_id,className:'fcard',style:{marginBottom:10,
            border:d.alerta_atraso?'1.5px solid #fca5a5':'1.5px solid var(--border)'}},
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}},
            h('p',{style:{fontWeight:700,fontSize:14}},d.recorredor_nombre),
            d.alerta_atraso&&h('span',{className:'pill',style:{background:'#fee2e2',color:'#991b1b'}},h(Ico,{n:'alert',s:11}),' Atraso')
          ),
          h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:6}},
            h('span',{style:{fontSize:12,color:'var(--slate)'}},'Rondas hoy'),
            h('span',{style:{fontSize:13,fontWeight:700}},`${d.rondas_completadas} / ${d.rondas_completadas + d.rondas_pendientes}`)
          ),
          d.ronda_en_curso&&h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:6,marginBottom:4}},
            h('span',{style:{fontSize:11,color:'#1d4ed8'}},`Ronda ${d.ronda_en_curso.numero_ronda} en curso desde ${fmtDate(d.ronda_en_curso.fecha)}`),
            h('button',{
              onClick:()=>setConfirmCancelar({id:d.ronda_en_curso.id,nombre:d.recorredor_nombre}),
              style:{background:'none',border:'1px solid #fca5a5',color:'#dc2626',borderRadius:6,padding:'2px 8px',fontSize:10,fontWeight:700,cursor:'pointer',fontFamily:'inherit',flexShrink:0}
            },'Cancelar')
          ),
          d.ronda_en_pausa&&h('div',{style:{fontSize:11,color:'#92400e',marginBottom:4,fontWeight:700}},
            `En pausa: ${d.ronda_en_pausa.motivo} (${d.ronda_en_pausa.minutos} min)`),
          d.apoyo_en_curso&&h('div',{style:{fontSize:11,color:'#0f766e',marginBottom:4}},`En apoyo: ${d.apoyo_en_curso.motivo}`),
          h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:4}},
            h('span',{style:{fontSize:12,color:'var(--slate)'}},'Último QR'),
            h('span',{style:{fontSize:12}},d.ultimo_evento?d.ultimo_evento.detalle:'—')
          ),
          h('div',{style:{display:'flex',justifyContent:'space-between'}},
            h('span',{style:{fontSize:12,color:'var(--slate)'}},'Sin movimiento'),
            h('span',{style:{fontSize:12,fontWeight:700,color:d.alerta_atraso?'#dc2626':'var(--text2)'}},
              d.minutos_sin_movimiento!=null?`${d.minutos_sin_movimiento} min`:'—')
          ),
          d.historial_apoyos.length>0&&h('details',{style:{marginTop:8}},
            h('summary',{style:{fontSize:11,color:'var(--slate)',cursor:'pointer'}},`Historial de apoyos (${d.historial_apoyos.length})`),
            d.historial_apoyos.map(a=>h('div',{key:a.id,style:{fontSize:11,padding:'4px 0',borderTop:'1px solid var(--border)'}},
              `${a.motivo} · ${(a.hora_llegada||'').slice(11,16)} – ${a.hora_salida?a.hora_salida.slice(11,16):'en curso'}`
            ))
          ),
          (d.rondas_hoy||[]).length>0&&h('details',{style:{marginTop:8}},
            h('summary',{style:{fontSize:11,color:'var(--slate)',cursor:'pointer'}},`Rondas de hoy (${d.rondas_hoy.length})`),
            d.rondas_hoy.map(rh=>h('div',{key:rh.ciclo_id,style:{padding:'4px 0',borderTop:'1px solid var(--border)'}},
              h('div',{style:{fontSize:11,display:'flex',justifyContent:'space-between',gap:6}},
                h('span',null,`Ronda ${rh.numero_ronda} (${rh.turno}) · ${(rh.hora_inicio||'').slice(11,16)}${rh.hora_fin?' – '+rh.hora_fin.slice(11,16):' – en curso'}`),
                h('span',{style:{fontWeight:700,color:rh.distancia_m!=null?'var(--navy)':'var(--slate)',flexShrink:0}},
                  rh.distancia_m!=null?(rh.distancia_m>=1000?(rh.distancia_m/1000).toFixed(2)+' km':rh.distancia_m+' m'):'Sin GPS'
                )
              ),
              rh.sospechosa&&h('div',{title:rh.motivo_sospecha||'',style:{marginTop:3,fontSize:10,fontWeight:700,color:'#991b1b',background:'#fee2e2',borderRadius:6,padding:'2px 6px',display:'inline-block'}},
                `⚠ Sospechosa · ${rh.motivo_sospecha||''}`
              )
            ))
          )
        ))
      ):(
        !semana||semana.recorredores.length===0?h('div',{className:'empty'},h(Ico,{n:'clipboard',s:44}),h('p',null,'No hay recorredores externos activos')):[
          h('p',{key:'rango',style:{fontSize:11,color:'var(--slate)',marginBottom:10}},`Del ${fmtDate(semana.desde)} al ${fmtDate(semana.hasta)}`),
          ...semana.recorredores.map(d=>h('div',{key:d.recorredor_id,className:'fcard',style:{marginBottom:10}},
            h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}},
              h('p',{style:{fontWeight:700,fontSize:14}},d.recorredor_nombre),
              pillCumplimiento(d.porcentaje)
            ),
            h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:6}},
              h('span',{style:{fontSize:12,color:'var(--slate)'}},'Rondas completadas'),
              h('span',{style:{fontSize:13,fontWeight:700}},`${d.total_completadas} / ${d.total_esperadas}`)
            ),
            h('div',{style:{display:'flex',justifyContent:'space-between'}},
              h('span',{style:{fontSize:12,color:'var(--slate)'}},'Novedades reportadas'),
              h('span',{style:{fontSize:12,fontWeight:700,color:d.novedades>0?'#dc2626':'var(--text2)'}},d.novedades)
            ),
            h('div',{style:{display:'flex',justifyContent:'space-between',marginTop:6}},
              h('span',{style:{fontSize:12,color:'var(--slate)'}},'Rondas sospechosas'),
              h('span',{style:{fontSize:12,fontWeight:700,color:d.rondas_sospechosas>0?'#991b1b':'var(--text2)'}},d.rondas_sospechosas)
            ),
            d.dias.length>0&&h('details',{style:{marginTop:8}},
              h('summary',{style:{fontSize:11,color:'var(--slate)',cursor:'pointer'}},`Detalle por turno (${d.dias.length})`),
              d.dias.map((t,i)=>h('div',{key:i,style:{display:'flex',justifyContent:'space-between',fontSize:11,padding:'4px 0',borderTop:'1px solid var(--border)'}},
                h('span',null,`${fmtDate(t.fecha)} · ${t.turno}`),
                h('span',{style:{fontWeight:600}},`${t.completadas} / ${t.esperadas}`)
              ))
            )
          ))
        ]
      )
    ),
    confirmCancelar&&h(ConfirmSheet,{
      msg:`Se cancelará la ronda atascada de ${confirmCancelar.nombre}. No contará como completada, pero ya podrá iniciar una ronda nueva.`,
      onOk:handleCancelarAdmin,
      onCancel:()=>setConfirmCancelar(null)
    })
  );
}

/* ── NOVEDADES PAGE ── */
function NovedadesPage({user}){
  const [items,setItems]       = useState([]);
  const [loading,setLoading]   = useState(true);
  const [alert,setAlert]       = useState(null);
  const [filtroEst,setFiltroEst] = useState('');
  const [filtroMod,setFiltroMod] = useState('');

  const esAdmin = ['admin','supervisor'].includes(user?.rol);

  const load = useCallback(()=>{
    setLoading(true);
    let url='/novedades';
    const ps=[];
    if(filtroEst) ps.push('estado='+filtroEst);
    if(filtroMod) ps.push('modulo='+filtroMod);
    if(ps.length) url+='?'+ps.join('&');
    api.get(url).then(r=>setItems(Array.isArray(r)?r:[])).catch(()=>{}).finally(()=>setLoading(false));
  },[filtroEst,filtroMod]);
  useEffect(()=>{ load(); },[load]);

  const cambiarEstado = async(id,estado)=>{
    try{
      await api.patch(`/novedades/${id}/estado`,{estado});
      setAlert({type:'ok',msg:'Estado actualizado'});
      load();
    }catch(e){ setAlert({type:'err',msg:'Error: '+e.message}); }
  };

  const EPILLS = {
    abierta:    {cls:'pill-red',  label:'Abierta'},
    en_revision:{cls:'pill-amber',label:'En revisión'},
    cerrada:    {cls:'pill-slate',label:'Cerrada'},
  };
  const MODS = {general:'General',flota:'Flota',proveedores:'Proveedores',acceso:'Acceso',visitantes:'Visitantes',ronda:'Ronda'};
  const CATS = {seguridad:'Seguridad',mantenimiento:'Mantenimiento',logistica:'Logística',otro:'Otro'};

  return h('div',{style:{display:'flex',flexDirection:'column',flex:1,overflow:'hidden'}},
    h('div',{className:'header'},
      h('div',{className:'header-inner'},
        h('div',{className:'header-brand'},
          h('h1',null,'Novedades'),
          h('span',null,'Incidencias del sistema')
        )
      )
    ),
    h('div',{style:{display:'flex',gap:6,padding:'8px 14px',background:'var(--white)',borderBottom:'1px solid var(--border)',flexShrink:0}},
      h('select',{value:filtroEst,onChange:e=>setFiltroEst(e.target.value),
        style:{flex:1,fontSize:12,padding:'6px 8px',border:'1.5px solid var(--border)',borderRadius:8,background:'#f8fafc',fontFamily:'inherit',appearance:'none'}},
        h('option',{value:''},'Todos los estados'),
        h('option',{value:'abierta'},'Abiertas'),
        h('option',{value:'en_revision'},'En revisión'),
        h('option',{value:'cerrada'},'Cerradas')
      ),
      h('select',{value:filtroMod,onChange:e=>setFiltroMod(e.target.value),
        style:{flex:1,fontSize:12,padding:'6px 8px',border:'1.5px solid var(--border)',borderRadius:8,background:'#f8fafc',fontFamily:'inherit',appearance:'none'}},
        h('option',{value:''},'Todos los módulos'),
        Object.entries(MODS).map(([v,l])=>h('option',{key:v,value:v},l))
      )
    ),
    h('div',{className:'scroll-body',style:{padding:'10px 14px'}},
      alert&&h(Alert,{...alert,onClose:()=>setAlert(null)}),
      loading?h(LoadingDots):
      items.length===0?h('div',{className:'empty'},h(Ico,{n:'bell',s:44}),h('p',null,'Sin novedades')):
      items.map(item=>{
        const ep=EPILLS[item.estado]||EPILLS.abierta;
        const dotColor=item.estado==='abierta'?'#dc2626':item.estado==='en_revision'?'#d97706':'#94a3b8';
        const dotBg  =item.estado==='abierta'?'#fee2e2':item.estado==='en_revision'?'#fef3c7':'#f1f5f9';
        return h('div',{key:item.id,className:'list-item',style:{flexDirection:'column',alignItems:'stretch',gap:8,cursor:'default'}},
          h('div',{style:{display:'flex',alignItems:'flex-start',gap:10}},
            h('div',{className:'li-icon',style:{background:dotBg,flexShrink:0}},
              h(Ico,{n:'bell',s:18,style:{color:dotColor}})
            ),
            h('div',{style:{flex:1,minWidth:0}},
              h('div',{className:'li-title',style:{whiteSpace:'normal',lineHeight:1.3}},item.descripcion),
              h('div',{className:'li-sub',style:{marginTop:3}},
                (MODS[item.modulo_origen]||item.modulo_origen)+' · '+(CATS[item.categoria]||item.categoria)
              ),
              h('div',{style:{fontSize:10,color:'var(--slate)',marginTop:2}},
                (item.usuario_nombre||'—')+' · '+fmtDate(item.fecha)+(item.hora?' '+item.hora.slice(0,5):'')
              )
            ),
            h('span',{className:`pill ${ep.cls}`,style:{flexShrink:0,alignSelf:'flex-start'}},ep.label)
          ),
          item.fotografia&&h('img',{src:item.fotografia,style:{width:'100%',borderRadius:8,maxHeight:130,objectFit:'cover'}}),
          esAdmin&&item.estado!=='cerrada'&&h('div',{style:{display:'flex',gap:6,justifyContent:'flex-end'}},
            item.estado==='abierta'&&h('button',{
              onClick:()=>cambiarEstado(item.id,'en_revision'),
              style:{fontSize:11,padding:'4px 10px',borderRadius:6,border:'1.5px solid #d97706',color:'#d97706',background:'none',cursor:'pointer',fontWeight:600}
            },'En revisión'),
            h('button',{
              onClick:()=>cambiarEstado(item.id,'cerrada'),
              style:{fontSize:11,padding:'4px 10px',borderRadius:6,border:'1.5px solid var(--slate)',color:'var(--slate)',background:'none',cursor:'pointer',fontWeight:600}
            },'Cerrar')
          )
        );
      })
    )
  );
}

      h('p',{style:{color:'var(--slate)',fontSize:14,fontWeight:600}},label),
      h('p',{style:{color:'var(--slate)',fontSize:12,opacity:.7}},'Módulo disponible en próxima entrega'),
      h('button',{onClick:()=>setPage('home'),style:{marginTop:8,background:'var(--navy2)',color:'#fff',border:'none',borderRadius:8,padding:'10px 20px',fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}},'Volver al inicio')
    )
  );
}

/* ── AUTORREGISTRO PÚBLICO DE PROVEEDORES (sin login) ── */
function ProveedorAutorregistroPage({token}){
  const [estado,setEstado]   = useState('validando'); // validando | valido | invalido | enviado
  const [tokenSesion,setTokenSesion] = useState(null);
  const [errorMsg,setErrorMsg] = useState('');
  const [saving,setSaving]   = useState(false);
  const tiposVehiculo = ['Camión','Camioneta','Moto','Furgón','Tractomula','Otro'];
  const tiposDocumento = ['CC','NIT','Otro'];
  const tiposCarga = ['Seca','Refrigerada','Mixta'];
  const formatosCarga = ['Paletizada','Granel','Mixta'];
  const manejosCarga = ['Conductor con certificado de montacargas','Reciservicios','Ercol','Operador logístico externo'];
  const emptyVeh = {placa_vehiculo:'',nombre_conductor:'',tipo_documento:'CC',cedula_conductor:'',telefono_conductor:'',tipo_vehiculo:'',hora_cita:'',
    fecha_pago_arl:'',epp_cumple:'',tipo_carga:'',formato_carga:'',cantidad_pallets:'',manejo_carga:'',tipos_logistica_inversa:null};
  const emptyOrd = {empresa:'',numero_orden_compra:''};
  const [vehiculo,setVehiculo] = useState(emptyVeh);
  const [ordenes,setOrdenes]   = useState([]);
  const [ordenDraft,setOrdenDraft] = useState(emptyOrd);
  const [frecuente,setFrecuente] = useState(null); // true|false|null (null = aun no se busco)
  // null | {estado:'buscando'} | {estado:'encontrado',proveedor,hora} | {estado:'no_encontrado'} | {estado:'error'}
  const [citaOrdenInfo,setCitaOrdenInfo] = useState(null);

  const buscarFrecuente = async(cedula)=>{
    setFrecuente(null);
    if(!cedula||cedula.trim().length<5||!tokenSesion) return;
    try{
      const r = await api.get(`/proveedores-publico/conductor-frecuente?cedula=${encodeURIComponent(cedula.trim())}&token=${encodeURIComponent(tokenSesion)}`);
      if(r.encontrado){
        setVehiculo(p=>({
          ...p,
          nombre_conductor: p.nombre_conductor||r.nombre_conductor||'',
          telefono_conductor: p.telefono_conductor||r.telefono||'',
          tipo_vehiculo: p.tipo_vehiculo||r.tipo_vehiculo||'',
        }));
        setFrecuente(true);
      } else {
        setFrecuente(false);
      }
    }catch(_){ setFrecuente(false); }
  };

  useEffect(()=>{
    if(!token){ setEstado('invalido'); setErrorMsg('Falta el código del QR. Escanéalo de nuevo desde la portería.'); return; }
    api.get(`/proveedores-publico/token-info?token=${encodeURIComponent(token)}`)
      .then(r=>{ setTokenSesion(r.token_sesion); setEstado('valido'); })
      .catch(e=>{ setEstado('invalido'); let msg=e.message; try{msg=JSON.parse(msg).detail||msg;}catch{} setErrorMsg(msg); });
  },[token]);

  /* El conductor nunca escribe el proveedor ni la hora de cita a mano: en
     cuanto completa los 10 dígitos del número de orden se busca (con
     debounce, para no disparar un request por cada tecla) contra las citas
     programadas de HOY. Si no hay match no hay fallback manual -- a
     diferencia del formulario del guarda, aquí la orden queda bloqueada
     (la autoridad real de todos modos es el servidor en POST /autorregistro,
     esto es solo UX). buscarCita queda aparte (no solo dentro del efecto)
     para que el estado 'error' de red pueda ofrecer un botón "Reintentar"
     sin obligar al conductor a borrar y volver a escribir el número. */
  const buscarCita = useCallback((numero)=>{
    if(!tokenSesion) return;
    setCitaOrdenInfo({estado:'buscando'});
    api.get(`/proveedores-publico/citas/buscar?numero_orden_compra=${encodeURIComponent(numero)}&token=${encodeURIComponent(tokenSesion)}`)
      .then(r=>{
        if(r&&r.encontrado) setCitaOrdenInfo({estado:'encontrado',proveedor:r.proveedor_nombre,hora:r.hora_cita_inicio||null});
        else setCitaOrdenInfo({estado:'no_encontrado'});
      })
      .catch(()=>setCitaOrdenInfo({estado:'error'}));
  },[tokenSesion]);

  useEffect(()=>{
    const numero = ordenDraft.numero_orden_compra;
    if(!/^4\d{9}$/.test(numero)||!tokenSesion){ setCitaOrdenInfo(null); return; }
    setCitaOrdenInfo({estado:'buscando'});
    const t = setTimeout(()=>buscarCita(numero),500);
    return ()=>clearTimeout(t);
  },[ordenDraft.numero_orden_compra,tokenSesion,buscarCita]);

  const agregarOrden = ()=>{
    if(!ordenDraft.numero_orden_compra.trim()){ setErrorMsg('El número de orden de compra es obligatorio'); return; }
    if(!/^4\d{9}$/.test(ordenDraft.numero_orden_compra.trim())){ setErrorMsg('El número de orden debe empezar en 4 y tener 10 dígitos (ej. 4001234567)'); return; }
    if(citaOrdenInfo?.estado!=='encontrado'){
      setErrorMsg('Esta orden no aparece en las citas programadas de hoy. Acércate a la caseta para que el guarda registre tu ingreso.');
      return;
    }
    const horaOrden = citaOrdenInfo.hora || null;
    const esPrimeraOrden = ordenes.length===0;
    const avisoHora = !esPrimeraOrden && horaOrden && vehiculo.hora_cita && horaOrden!==vehiculo.hora_cita;
    setOrdenes(p=>[...p,{
      empresa: citaOrdenInfo.proveedor,
      numero_orden_compra: ordenDraft.numero_orden_compra.trim(),
      _horaCita: horaOrden,
      _avisoHora: avisoHora,
    }]);
    // Hora de cita: campo único del vehículo, la fija la PRIMERA orden con
    // match. Si una orden posterior trae una hora distinta no se pisa -- solo
    // se marca el aviso informativo guardado arriba en _avisoHora.
    if(esPrimeraOrden && horaOrden) setVehiculo(p=>({...p,hora_cita:horaOrden}));
    setOrdenDraft({...emptyOrd});
    setCitaOrdenInfo(null);
    setErrorMsg('');
  };
  const quitarOrden = (i)=>setOrdenes(p=>{
    const n = p.filter((_,idx)=>idx!==i);
    // si se quita la primera orden (la que fijó la hora), la hora del
    // vehículo se re-deriva de la nueva primera orden con hora conocida (o
    // queda vacía si ya no queda ninguna).
    const nuevaPrimeraHora = n.find(o=>o._horaCita)?._horaCita || '';
    setVehiculo(pv=>({...pv,hora_cita:nuevaPrimeraHora}));
    return n;
  });

  const enviar = async()=>{
    setErrorMsg('');
    if(!vehiculo.placa_vehiculo.trim()) return setErrorMsg('La placa es obligatoria');
    if(!/^[A-Z]+[0-9]+$/.test(vehiculo.placa_vehiculo)) return setErrorMsg('La placa debe escribirse solo con letras seguidas de números, sin espacios ni caracteres especiales (ejemplo: ABC123)');
    if(!vehiculo.nombre_conductor.trim()) return setErrorMsg('El nombre del conductor es obligatorio');
    if(!vehiculo.tipo_documento) return setErrorMsg('Selecciona el tipo de documento');
    if(!vehiculo.cedula_conductor.trim()) return setErrorMsg('El número de documento es obligatorio');
    if(!vehiculo.telefono_conductor.trim()) return setErrorMsg('El teléfono del conductor es obligatorio');
    if(!vehiculo.tipo_vehiculo.trim()) return setErrorMsg('Selecciona el tipo de vehículo');
    if(!vehiculo.fecha_pago_arl) return setErrorMsg('La fecha de ARL es obligatoria');
    if(vehiculo.epp_cumple==='') return setErrorMsg('Indica si cuentas con los elementos de protección personal');
    if(!vehiculo.tipo_carga) return setErrorMsg('Selecciona el tipo de carga');
    if(!vehiculo.formato_carga) return setErrorMsg('Selecciona el formato de carga');
    if(!vehiculo.cantidad_pallets.trim()) return setErrorMsg('La cantidad de pallets es obligatoria');
    if(!vehiculo.manejo_carga) return setErrorMsg('Selecciona quién maneja la carga');
    if(!Array.isArray(vehiculo.tipos_logistica_inversa)) return setErrorMsg('Indica si el vehículo trae logística inversa (selecciona una opción o marca "No aplica")');
    if(ordenes.length===0) return setErrorMsg('Agrega al menos un proveedor/orden a la que vienes a entregar');
    setSaving(true);
    try{
      await api.post('/proveedores-publico/autorregistro',{
        token:tokenSesion, vehiculo:{...vehiculo,placa_vehiculo:vehiculo.placa_vehiculo.toUpperCase(),epp_cumple:vehiculo.epp_cumple==='si'}, ordenes,
      });
      setEstado('enviado');
    }catch(e){
      let msg=e.message; try{msg=JSON.parse(msg).detail||msg;}catch{}
      setErrorMsg(msg);
    }finally{ setSaving(false); }
  };

  const Shell = (...children)=>h('div',{style:{height:'100%',display:'flex',flexDirection:'column',overflow:'hidden',background:'var(--bg,#f8fafc)'}},
    h('div',{className:'header'},
      h('div',{className:'header-inner'},
        h('div',{className:'header-brand'},h('h1',null,'Ingreso de Proveedores'),h('span',null,'CEDI R10'))
      )
    ),
    h('div',{className:'scroll-body',style:{padding:'16px 14px',maxWidth:480,margin:'0 auto',width:'100%',boxSizing:'border-box'}},...children)
  );

  if(estado==='validando') return Shell(h('div',{style:{textAlign:'center',paddingTop:60}},h(LoadingDots)));

  if(estado==='invalido') return Shell(
    h('div',{style:{textAlign:'center',paddingTop:40}},
      h(Ico,{n:'alert',s:44,style:{color:'#dc2626',marginBottom:12}}),
      h('p',{style:{fontWeight:700,fontSize:15,marginBottom:6}},'No se pudo validar el código'),
      h('p',{style:{color:'var(--slate)',fontSize:13}},errorMsg||'Pide al guarda que te muestre el QR actualizado y escanéalo de nuevo.')
    )
  );

  if(estado==='enviado') return Shell(
    h('div',{style:{textAlign:'center',paddingTop:40}},
      h(Ico,{n:'checkCircle',s:44,style:{color:'#16a34a',marginBottom:12}}),
      h('p',{style:{fontWeight:700,fontSize:15,marginBottom:6}},'Registro enviado'),
      h('p',{style:{color:'var(--slate)',fontSize:13}},'El guarda confirmará tu ingreso en un momento. Puedes cerrar esta página.')
    )
  );

  return Shell(
    errorMsg&&h(Alert,{type:'err',msg:errorMsg,onClose:()=>setErrorMsg('')}),
    h('div',{className:'fcard'},
      h('p',{className:'sec-ttl'},h(Ico,{n:'truck',s:12}),' Datos del vehículo y conductor'),
      // Cédula primero (con tipo de documento): dispara buscarFrecuente()
      // ANTES de que el conductor escriba nombre/teléfono/tipo de vehículo a
      // mano, para que esos campos lleguen ya precargados si es un conductor
      // frecuente (ver buscarFrecuente arriba). Pedido explícito de Karen --
      // antes cédula era el 3er campo, y el conductor ya había escrito su
      // nombre a mano antes de llegar ahí, así que el autocompletado de
      // nombre casi nunca llegaba a tiempo de servir.
      h('div',{className:'fgrid2'},
        h('div',{className:'fg'},h('label',null,'Tipo de documento',h('span',{className:'req'},'*')),
          h('select',{value:vehiculo.tipo_documento,onChange:e=>setVehiculo(p=>({...p,tipo_documento:e.target.value}))},
            ...tiposDocumento.map(t=>h('option',{key:t,value:t},t))
          )
        ),
        h('div',{className:'fg'},h('label',null,'N° de documento',h('span',{className:'req'},'*')),
          h('input',{type:'text',value:vehiculo.cedula_conductor,
            onChange:e=>{setVehiculo(p=>({...p,cedula_conductor:e.target.value}));setFrecuente(null);},
            onBlur:e=>buscarFrecuente(e.target.value),
            placeholder:'Número'}),
          frecuente===true&&h('div',{style:{marginTop:5,padding:'5px 9px',borderRadius:7,fontSize:11,fontWeight:700,display:'flex',alignItems:'center',gap:5,background:'#d1fae5',color:'#065f46',border:'1px solid #6ee7b7'}},
            h(Ico,{n:'check',s:12}),'Te reconocimos — completa los datos que falten')
        )
      ),
      h('div',{className:'fg'},h('label',null,'Placa',h('span',{className:'req'},'*')),
        h('input',{type:'text',value:vehiculo.placa_vehiculo,onChange:e=>setVehiculo(p=>({...p,placa_vehiculo:e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'')})),placeholder:'ABC123 (letras y luego números, sin espacios ni guiones)'})
      ),
      h('div',{className:'fg'},h('label',null,'Nombre conductor',h('span',{className:'req'},'*')),h('input',{type:'text',value:vehiculo.nombre_conductor,onChange:e=>setVehiculo(p=>({...p,nombre_conductor:e.target.value})),onBlur:()=>setVehiculo(p=>({...p,nombre_conductor:capitalizarNombre(p.nombre_conductor)})),placeholder:'Nombre completo'})),
      h('div',{className:'fgrid2'},
        h('div',{className:'fg'},h('label',null,'Teléfono',h('span',{className:'req'},'*')),h('input',{type:'tel',value:vehiculo.telefono_conductor,onChange:e=>setVehiculo(p=>({...p,telefono_conductor:e.target.value})),placeholder:'Número de contacto'})),
        h('div',{className:'fg'},h('label',null,'Tipo vehículo',h('span',{className:'req'},'*')),
          h('select',{value:vehiculo.tipo_vehiculo,onChange:e=>setVehiculo(p=>({...p,tipo_vehiculo:e.target.value}))},
            h('option',{value:''},'Seleccionar...'),...tiposVehiculo.map(t=>h('option',{key:t,value:t},t))
          )
        )
      ),
      h('div',{className:'fg'},h('label',null,'Hora de tu cita'),
        vehiculo.hora_cita
          ? h('div',{style:{padding:'8px 10px',borderRadius:8,background:'#f1f5f9',border:'1.5px dashed var(--border)',fontWeight:700,fontSize:13,color:'var(--text)',display:'flex',alignItems:'center',gap:6}},h(Ico,{n:'clock',s:13}),vehiculo.hora_cita)
          : h('div',{style:{padding:'8px 10px',borderRadius:8,background:'#f8fafc',border:'1.5px dashed var(--border)',fontSize:12,color:'var(--slate)',display:'flex',alignItems:'center',gap:6}},h(Ico,{n:'clock',s:13}),'Se completa sola al agregar tu primera orden abajo')
      )
    ),
    h('div',{className:'fcard'},
      h('p',{className:'sec-ttl'},h(Ico,{n:'checkCircle',s:12}),' Seguridad y carga'),
      h('div',{className:'fgrid2'},
        h('div',{className:'fg'},h('label',null,'Fecha ARL',h('span',{className:'req'},'*')),h('input',{type:'date',min:'2000-01-01',max:'2100-12-31',value:vehiculo.fecha_pago_arl,onChange:e=>{if(fechaValida(e.target.value))setVehiculo(p=>({...p,fecha_pago_arl:e.target.value}));}})),
        h('div',{className:'fg'},h('label',null,'¿Cuentas con EPP?',h('span',{className:'req'},'*')),
          h('select',{value:vehiculo.epp_cumple,onChange:e=>setVehiculo(p=>({...p,epp_cumple:e.target.value}))},
            h('option',{value:''},'Seleccionar...'),h('option',{value:'si'},'Sí'),h('option',{value:'no'},'No')
          )
        )
      ),
      vehiculo.epp_cumple==='no'&&h('div',{className:'warn'},'Sin los elementos de protección personal completos, puede que no se autorice tu ingreso.'),
      h('div',{className:'fgrid2'},
        h('div',{className:'fg'},h('label',null,'Tipo de carga',h('span',{className:'req'},'*')),
          h('select',{value:vehiculo.tipo_carga,onChange:e=>setVehiculo(p=>({...p,tipo_carga:e.target.value}))},
            h('option',{value:''},'Seleccionar...'),...tiposCarga.map(t=>h('option',{key:t,value:t},t))
          )
        ),
        h('div',{className:'fg'},h('label',null,'Formato de carga',h('span',{className:'req'},'*')),
          h('select',{value:vehiculo.formato_carga,onChange:e=>{
            const v=e.target.value;
            setVehiculo(p=>({...p,formato_carga:v,cantidad_pallets:(v==='Granel'||v==='Mixta')?'No aplica':(p.cantidad_pallets==='No aplica'?'':p.cantidad_pallets)}));
          }},
            h('option',{value:''},'Seleccionar...'),...formatosCarga.map(t=>h('option',{key:t,value:t},t))
          )
        )
      ),
      h('div',{className:'fgrid2'},
        h('div',{className:'fg'},h('label',null,'Cantidad de pallets',h('span',{className:'req'},'*')),
          h('input',{type:'text',inputMode:'numeric',value:vehiculo.cantidad_pallets,readOnly:vehiculo.formato_carga==='Granel'||vehiculo.formato_carga==='Mixta',onChange:e=>setVehiculo(p=>({...p,cantidad_pallets:e.target.value})),placeholder:'Ej: 10',style:(vehiculo.formato_carga==='Granel'||vehiculo.formato_carga==='Mixta')?{background:'#f8fafc',cursor:'default'}:null})
        ),
        h('div',{className:'fg'},h('label',null,'¿Quién maneja la carga?',h('span',{className:'req'},'*')),
          h('select',{value:vehiculo.manejo_carga,onChange:e=>setVehiculo(p=>({...p,manejo_carga:e.target.value}))},
            h('option',{value:''},'Seleccionar...'),...manejosCarga.map(t=>h('option',{key:t,value:t},t))
          )
        )
      ),
      vehiculo.manejo_carga==='Conductor con certificado de montacargas'&&h('div',{className:'tip'},'Recuerda traer tu certificado de montacargas vigente.'),
      h(LogisticaInversaField,{value:vehiculo.tipos_logistica_inversa,onChange:v=>setVehiculo(p=>({...p,tipos_logistica_inversa:v}))})
    ),
    h('div',{className:'fcard',style:{border:'1.5px solid var(--navy)'}},
      h('p',{className:'sec-ttl',style:{color:'var(--navy)'}},h(Ico,{n:'package',s:12}),` Proveedores / órdenes que traes (${ordenes.length})`),
      ordenes.map((o,i)=>h('div',{key:i,style:{padding:'6px 0',borderBottom:'1px solid var(--border)'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:8}},
          h('div',{style:{flex:1,minWidth:0}},
            h('div',{style:{fontWeight:700,fontSize:13}},o.empresa),
            h('div',{style:{fontSize:11,color:'var(--slate)'}},'OC '+o.numero_orden_compra+(o._horaCita?' · Cita '+o._horaCita:''))
          ),
          h('button',{onClick:()=>quitarOrden(i),'aria-label':'Quitar esta orden de la lista',style:{background:'#fee2e2',border:'none',cursor:'pointer',color:'#dc2626',padding:'10px',minWidth:36,minHeight:36,display:'flex',alignItems:'center',justifyContent:'center',borderRadius:8,fontSize:11,flexShrink:0}},h(Ico,{n:'trash',s:14}))
        ),
        o._avisoHora&&h('div',{style:{marginTop:4,padding:'6px 9px',borderRadius:7,fontSize:11,fontWeight:600,display:'flex',alignItems:'flex-start',gap:5,background:'#fef3c7',color:'#92400e',border:'1px solid #fde68a'}},
          h(Ico,{n:'alert',s:12}),`Esta orden tiene una cita a las ${o._horaCita}. Ya se registró tu llegada a las ${vehiculo.hora_cita} y esa es la hora que queda — no tienes que hacer nada.`
        )
      )),
      h('div',{style:{marginTop:10,paddingTop:10,borderTop:'1px dashed var(--border)'}},
        h('div',{className:'fg'},h('label',null,'N° orden de compra',h('span',{className:'req'},'*')),
          h('input',{type:'text',inputMode:'numeric',maxLength:10,value:ordenDraft.numero_orden_compra,onChange:e=>setOrdenDraft(p=>({...p,numero_orden_compra:e.target.value.replace(/[^0-9]/g,'').slice(0,10)})),placeholder:'10 dígitos, empieza en 4 (ej. 4001234567)'})
        ),
        // El input solo dispara la búsqueda cuando calza el patrón /^4\d{9}$/;
        // si el conductor llega a 10 dígitos pero no arrancan en 4, la
        // búsqueda nunca se dispara y antes se quedaba sin ningún mensaje
        // (placeholder ya tapado, botón gris sin explicación). Este aviso
        // cubre ese hueco sin tocar la llamada al servidor.
        ordenDraft.numero_orden_compra.length===10&&!ordenDraft.numero_orden_compra.startsWith('4')&&h('div',{style:{marginTop:5,marginBottom:8,padding:'8px 10px',borderRadius:7,fontSize:12,fontWeight:600,display:'flex',alignItems:'flex-start',gap:6,background:'#fee2e2',color:'#991b1b',border:'1px solid #fca5a5'}},
          h(Ico,{n:'alert',s:14}),'El número de orden debe empezar en 4. Revisa que lo hayas escrito completo y sin errores.'
        ),
        citaOrdenInfo?.estado==='buscando'&&h('div',{style:{marginTop:5,marginBottom:8,padding:'8px 10px',borderRadius:7,fontSize:12,fontWeight:600,color:'#1e40af',display:'flex',alignItems:'center',gap:8,background:'#eff6ff',border:'1px solid #bfdbfe'}},
          h('div',{className:'loading-dots',style:{padding:0,gap:4,transform:'scale(.7)',transformOrigin:'left center'}},h('span'),h('span'),h('span')),'Buscando cita programada...'
        ),
        citaOrdenInfo?.estado==='encontrado'&&h('div',{className:'fg'},h('label',null,'Proveedor'),
          h('div',{style:{padding:'8px 10px',borderRadius:8,background:'#d1fae5',border:'1px solid #6ee7b7',color:'#065f46',fontWeight:700,fontSize:13,display:'flex',alignItems:'center',gap:6}},
            h(Ico,{n:'check',s:14}),citaOrdenInfo.proveedor
          )
        ),
        citaOrdenInfo?.estado==='no_encontrado'&&h('div',{style:{marginTop:5,marginBottom:8,padding:'8px 10px',borderRadius:7,fontSize:12,fontWeight:600,display:'flex',alignItems:'flex-start',gap:6,background:'#fee2e2',color:'#991b1b',border:'1px solid #fca5a5'}},
          h(Ico,{n:'alert',s:14}),'Esta orden no aparece en las citas programadas de hoy. Acércate a la caseta para que el guarda registre tu ingreso.'
        ),
        citaOrdenInfo?.estado==='error'&&h('div',{style:{marginTop:5,marginBottom:8,padding:'8px 10px',borderRadius:7,fontSize:12,fontWeight:600,display:'flex',alignItems:'flex-start',gap:6,background:'#fef3c7',color:'#92400e',border:'1px solid #fde68a'}},
          h(Ico,{n:'wifiOff',s:14}),
          h('div',null,
            h('p',{style:{margin:'0 0 5px'}},'No pudimos verificar esta orden — revisa tu señal.'),

/* ── MUELLES (tablero de ocupación, solo lectura) ──
   Fase 2 de la consolidación con citas-muelles-cedi-r10: esta pantalla NO
   tiene ningún control de escritura (asignar/liberar/crear/editar muelle) a
   propósito -- decisión del arquitecto para no abrir una segunda vía de
   escritura sobre el mismo estado operativo que hoy gestionan los guardas
   en la otra app. Si se necesita accionar sobre un muelle, eso se hace
   desde Citas y Muelles, no desde acá. */
// Celda compacta y numerada (56-64px) que reemplaza a la card vertical de
// antes -- ver comentario en .muelle-grid (arriba, en la hoja de estilos)
// sobre por qué se hizo el cambio. Solo las celdas "ocupado" son clickeables:
// las libres no tienen nada que mostrar en el panel de detalle, así que se
// renderizan como <button disabled> (informativas, no interactivas).
function MuelleCelda({muelle:m, seleccionado, onSeleccionar}){
  const ocupado = m.estado==='ocupado';
  // Discordancia = el proveedor que ocupa el muelle trae un tipo de carga
  // distinto al habitual de ese muelle. Es solo informativo (no bloquea
  // nada, la vista es de solo lectura); en la celda se reduce a un punto
  // azul sutil en la esquina (.muelle-celda-dot) para no competir con el
  // ámbar de "tiempo excedido", que es la señal prioritaria del tablero. El
  // detalle textual completo se muestra en MuelleDetallePanel al seleccionar.
  const discordancia = ocupado && m.tipo_carga_habitual && m.tipo_carga && m.tipo_carga_habitual!==m.tipo_carga;
  const clases = ['muelle-celda', m.alerta_tiempo?'alerta':(ocupado?'ocupado':'libre')];
  if(seleccionado) clases.push('selected');
  return h('button',{
    type:'button',
    className:clases.join(' '),
    disabled:!ocupado,
    'aria-pressed':ocupado?!!seleccionado:undefined,
    onClick:ocupado?()=>onSeleccionar(m.id):undefined,
    title:`Muelle ${m.numero} — ${ocupado?(m.alerta_tiempo?'ocupado, tiempo excedido':'ocupado'):'libre'}`
  },
    discordancia&&h('span',{className:'muelle-celda-dot','aria-hidden':'true'}),
    h('span',{className:'muelle-celda-num'},m.numero),
    m.tipo_carga_habitual&&h(TipoCargaBadgeMini,{tipo:m.tipo_carga_habitual})
  );
}

function MuellesPage({user}){
  const [muelles,setMuelles] = useState([]);
  const [loading,setLoading] = useState(true);
  const [error,setError]     = useState(null);
  // Un solo muelle seleccionado a la vez para el panel de detalle. Guarda
  // el id (no el objeto completo) para que el panel siempre muestre el dato
  // más reciente tras cada refresco del polling.
  const [seleccionId,setSeleccionId] = useState(null);

  const load = useCallback(()=>{
    api.get('/muelles')
      .then(r=>{ setMuelles(Array.isArray(r)?r:(r.items||[])); setError(null); })
      .catch(()=>setError('No se pudo cargar el estado de los muelles'))
      .finally(()=>setLoading(false));
  },[]);
  // Igual que Flota/Proveedores: es un tablero operativo (guardas y
  // coordinador lo miran para saber qué muelle está libre), así que se
  // refresca cada minuto y se pausa en background.
  useVisibilityPolling(load, 60000, [load]);

  const ocupados = muelles.filter(m=>m.estado==='ocupado').length;
  const seleccionarMuelle = id => setSeleccionId(prev=>prev===id?null:id);
  // Si el muelle seleccionado se liberó (o desapareció) en un refresco de
  // polling, no queda nada que mostrar y el panel simplemente no se pinta.
  const muelleSeleccionado = seleccionId!=null ? muelles.find(m=>m.id===seleccionId && m.estado==='ocupado') : null;

  return h('div',{style:{display:'flex',flexDirection:'column',flex:1,overflow:'hidden'}},
    h('div',{className:'header'},
      h('div',{className:'header-inner'},
        h('div',{className:'header-brand'},h('h1',null,'Muelles'),h('span',null,'Vista de consulta'))
      )
    ),
    h('div',{style:{padding:'10px 14px',background:'var(--white)',borderBottom:'1px solid var(--border)'}},
      h('p',{style:{fontSize:11,color:'var(--slate)'}},
        'Estado de ocupación derivado del registro de ingreso de Proveedores — vista de solo consulta.'
      ),
      !loading&&!error&&muelles.length>0&&h('p',{style:{fontSize:11,color:'var(--text2)',fontWeight:700,marginTop:6}},
        `${ocupados} ocupado${ocupados===1?'':'s'} de ${muelles.length}`
      ),
      // Leyenda del tablero: solo los 4 estados/indicadores que existen hoy
      // en la grilla (ver comentario de .muelle-leyenda en la hoja de
      // estilos). No incluye REF/SEC/MIX -- esa etiqueta ya se explica sola
      // dentro de cada celda y agregarla aquí solo suma ruido a una leyenda
      // que debe leerse de un vistazo.
      !loading&&!error&&muelles.length>0&&h('div',{className:'muelle-leyenda'},
        h('span',{className:'muelle-leyenda-item'},
          h('span',{className:'muelle-leyenda-swatch libre','aria-hidden':'true'}),'Libre'
        ),
        h('span',{className:'muelle-leyenda-item'},
          h('span',{className:'muelle-leyenda-swatch ocupado','aria-hidden':'true'}),'Ocupado'
        ),
        h('span',{className:'muelle-leyenda-item'},
          h('span',{className:'muelle-leyenda-swatch alerta','aria-hidden':'true'}),'Tiempo excedido'
        ),
        h('span',{className:'muelle-leyenda-item'},
          h('span',{className:'muelle-leyenda-dot','aria-hidden':'true'}),'Carga distinta a la habitual'
        )
      )
    ),
    h('div',{className:'scroll-body',style:{padding:'12px 14px'}},
      error&&h(Alert,{type:'err',msg:error,onClose:()=>setError(null)}),
      loading?h(LoadingDots):
      muelles.length===0?h('div',{className:'empty'},h(Ico,{n:'mapPin',s:44}),h('p',null,'No hay muelles configurados todavía')):
      h(React.Fragment,null,
        muelleSeleccionado&&h(MuelleDetallePanel,{muelle:muelleSeleccionado,onCerrar:()=>setSeleccionId(null)}),
        h('div',{className:'muelle-grid'},muelles.map(m=>h(MuelleCelda,{
          key:m.id,muelle:m,seleccionado:m.id===seleccionId,onSeleccionar:seleccionarMuelle
        })))
      ),
      h(MuellesLogisticaInversaSection)
    )
  );
}

/* ── CITAS (Fase 3, solo lectura) ──
   Misma estructura que MuellesPage: useVisibilityPolling cada 60s, mismo
   header con subtítulo "Vista de consulta" y el mismo aviso fijo de que la
   carga del archivo del WMS y la tolerancia se gestionan desde
   citas-muelles-cedi-r10. */
function CitasPage({user}){
  const [citas,setCitas]   = useState([]);
  const [config,setConfig] = useState(null);
  const [alertasCitas,setAlertasCitas] = useState(null);
  const [loading,setLoading] = useState(true);
  const [error,setError]     = useState(null);
  // Rango de fechas para el export (Sección "proveedores que no llegaron"),
  // independiente del tablero de hoy de abajo, que sigue fijo a today().
  const [fi,setFi] = useState(today());
  const [ff,setFf] = useState(today());

  const load = useCallback(()=>{
    Promise.all([
      api.get(`/citas?fecha=${today()}`),
      api.get('/citas/config'),
      api.get('/citas/alertas'),
    ]).then(([listado,cfg,al])=>{
      setCitas(Array.isArray(listado)?listado:(listado.items||[]));
      setConfig(cfg);
      setAlertasCitas(al);
      setError(null);
    }).catch(()=>setError('No se pudo cargar el estado de las citas'))
      .finally(()=>setLoading(false));
  },[]);
  // Igual que Muelles: tablero operativo que el coordinador consulta
  // seguido, así que se refresca cada minuto y se pausa en background.
  useVisibilityPolling(load, 60000, [load]);

  // Suena una alerta cuando a una cita programada le falten <=5 min para su
  // hora de inicio (alertasCitas.por_iniciar). Una sola vez por orden de
  // compra -- mismo patrón que MuellesPage en citas-muelles-cedi-r10.
  const avisadosInicio = useRef(new Set());
  useEffect(()=>{
    if(!alertasCitas) return;
    const vistosIds = new Set();
    (alertasCitas.por_iniciar||[]).forEach(c=>{
      vistosIds.add(c.numero_orden_compra);
      if(!avisadosInicio.current.has(c.numero_orden_compra)){
        avisadosInicio.current.add(c.numero_orden_compra);
        playAlertSound();
      }
    });
    avisadosInicio.current.forEach(id=>{ if(!vistosIds.has(id)) avisadosInicio.current.delete(id); });
  },[alertasCitas]);

  const hhmm = t => t ? String(t).slice(0,5) : '—';

  return h('div',{style:{display:'flex',flexDirection:'column',flex:1,overflow:'hidden'}},
    h('div',{className:'header'},
      h('div',{className:'header-inner'},
        h('div',{className:'header-brand'},h('h1',null,'Citas'),h('span',null,'Vista de consulta'))
      )
    ),
    h('div',{style:{padding:'10px 14px',background:'var(--white)',borderBottom:'1px solid var(--border)'}},
      h('p',{style:{fontSize:11,color:'var(--slate)'}},
        'La carga del archivo del WMS se hace desde Proveedores → Citas del día. La tolerancia de citas se configura desde este módulo, solo para roles con permiso de escritura (hoy, administración) — aquí puedes consultar el estado del día.'
      ),
      !loading&&!error&&config&&h('span',{className:'pill pill-slate',style:{marginTop:6,display:'inline-block'}},
        `Tolerancia vigente: ${config.tolerancia_min_default} min`
      )
    ),
    puede(user,'citas','export')&&h('div',{style:{display:'flex',gap:8,padding:'8px 14px',flexWrap:'wrap',alignItems:'flex-end',background:'var(--white)',borderBottom:'1px solid var(--border)'}},
      h('div',{style:{display:'flex',flexDirection:'column',gap:2}},h('label',{style:{fontSize:10,color:'var(--slate)',fontWeight:600}},'Desde'),h('input',{type:'date',value:fi,onChange:e=>setFi(e.target.value),style:{fontSize:12}})),
      h('div',{style:{display:'flex',flexDirection:'column',gap:2}},h('label',{style:{fontSize:10,color:'var(--slate)',fontWeight:600}},'Hasta'),h('input',{type:'date',value:ff,onChange:e=>setFf(e.target.value),style:{fontSize:12}})),
      h('button',{onClick:()=>api.exportar('citas',fi,ff),style:{background:'none',border:'1.5px solid var(--slate)',color:'var(--slate)',borderRadius:8,padding:'7px 12px',cursor:'pointer',display:'flex',alignItems:'center',gap:4,fontSize:12,fontWeight:600,fontFamily:'inherit'}},
        h(Ico,{n:'download',s:14}),' Excel · No llegaron'
      )
    ),
    h('div',{className:'scroll-body',style:{padding:'12px 14px'}},
      error&&h(Alert,{type:'err',msg:error,onClose:()=>setError(null)}),
      loading?h(LoadingDots):h(React.Fragment,null,

        alertasCitas&&h('div',{style:{display:'flex',flexDirection:'column',gap:8,marginBottom:14}},
          h('div',{className:'alert alert-err',style:{marginBottom:0}},
            h(Ico,{n:'alert',s:14}),
            h('span',null,`${alertasCitas.vencidas.length} cita${alertasCitas.vencidas.length===1?'':'s'} vencida${alertasCitas.vencidas.length===1?'':'s'}`)
          ),
          h('div',{className:'alert alert-warn',style:{marginBottom:0}},
            h(Ico,{n:'alert',s:14}),
            h('span',null,`${alertasCitas.por_vencer.length} por vencer (≤10 min)`)
          ),
          h('div',{className:'alert',style:{marginBottom:0,background:'#dbeafe',color:'#1d4ed8',border:'1px solid #93c5fd'}},
            h(Ico,{n:'calendar',s:14}),
            h('span',null,`${alertasCitas.por_iniciar.length} por iniciar (≤5 min)`)
          ),
          h('p',{style:{fontSize:10,color:'var(--slate)'}},
            alertasCitas.archivo_hoy
              ? `Archivo del WMS cargado hoy${alertasCitas.hora_carga?` — ${fmtDateHora(alertasCitas.hora_carga)}`:''}.`
              : 'Todavía no se ha cargado el archivo del WMS para hoy.'
          )
        ),

        citas.length===0
          ? h('div',{className:'empty'},h(Ico,{n:'calendar',s:44}),h('p',null,'No hay citas cargadas para hoy'))
          : h('div',{style:{overflowX:'auto'}},
              h('table',{className:'preview-table'},
                h('thead',null,h('tr',null,
                  h('th',null,'Hora'),h('th',null,'O. Compra'),h('th',null,'Proveedor'),h('th',null,'Carga'),h('th',null,'Pallets')
                )),
                h('tbody',null,
                  citas.map(c=>h('tr',{key:c.id},
                    h('td',null,`${hhmm(c.hora_cita_inicio)} – ${hhmm(c.hora_cita_fin)}`),
                    h('td',null,c.numero_orden_compra||'—'),
                    h('td',null,c.proveedor_nombre||'—'),
                    h('td',null,c.descripcion_carga||'—'),
                    h('td',null,c.cantidad_pallets||'—')
                  ))
                )
              )
            )
      )
    )
  );
}

/* ── APP ROOT ── */
function App(){
  const qs = new URLSearchParams(window.location.search);
  if(qs.get('ingreso_proveedor')!=null) return h(ProveedorAutorregistroPage,{token:qs.get('token')});

  const [user,setUser]       = useState(getUser);
  const [page,setPageState]  = useState('home');
  const [online,setOnline]   = useState(navigator.onLine);
  const [queue,setQueue]     = useState(getQueue);
  const [openFlotaId,setOpenFlotaId] = useState(null);

  const navigate = (newPage)=>{
    if(newPage===page) return;
    window.history.pushState({page:newPage},'','');
    setPageState(newPage);
  };

  useEffect(()=>{
    const on  = ()=>setOnline(true);
    const off = ()=>setOnline(false);
    window.addEventListener('online',on);
    window.addEventListener('offline',off);
    return ()=>{ window.removeEventListener('online',on); window.removeEventListener('offline',off); };
  },[]);

  useEffect(()=>{
    window.history.replaceState({page:'home'},'','');
    const onPop = e=>setPageState(e.state?.page||'home');
    window.addEventListener('popstate',onPop);
    return ()=>window.removeEventListener('popstate',onPop);
  },[]);

  // Mantiene sincronizados nombre/rol con la BD: si a este usuario le
  // cambiaron el rol después de iniciar sesión, el localStorage quedaría
  // con datos viejos y el menú mostraría módulos que el backend ya no
  // le permite, causando 403 ("Error cargando datos") en esas pestañas.
  const syncUser = useCallback(()=>{
    api.get('/auth/me').then(u=>{
      if(!u) return;
      setUser(prev=>{
        const merged = {...prev,...u};
        localStorage.setItem('cv_user',JSON.stringify(merged));
        return merged;
      });
    }).catch(()=>{});
  },[]);
  // Se mantiene en 5 min (no es dato operativo urgente) pero también se
  // pausa en background: si la sesión está oculta/bloqueada no hay 403 que
  // prevenir en ese momento, así que no vale la pena seguir consultando.
  useVisibilityPolling(syncUser, 300000, [user?.id], !!user);

  const addOffline = (item)=>{ addToQueue(item); setQueue(getQueue()); };

  const syncQueue = async()=>{
    const q = getQueue();
    if(!q.length||!online) return;
    let ok=0,fail=0;
    for(const item of q){
      try{
        if(item.method==='POST') await api.post(item.endpoint,item.body);
        else if(item.method==='PUT') await api.put(item.endpoint,item.body);
        ok++;
      }catch(e){fail++;}
    }
    clearQueue(); setQueue([]);
    alert(`Sincronización: ${ok} enviados, ${fail} con error.`);
  };

  if(!user) return h(LoginPage,{onLogin:(u)=>setUser(u)});

  const rol = user?.rol||'';
  const navItems =
    rol==='guarda_bodega'        ? [{id:'home',label:'Inicio',icon:'home'},{id:'flota',label:'Flota',icon:'truck'},{id:'prov',label:'Proveedores',icon:'package'},{id:'visitavh',label:'Visita Vh.',icon:'truck'}]
    :rol==='guarda_peatonal'     ? [{id:'home',label:'Inicio',icon:'home'},{id:'acceso',label:'Acceso',icon:'userCheck'},{id:'visit',label:'Visitas',icon:'users'},{id:'sust',label:'Sust.',icon:'alert'},{id:'herr',label:'Herram.',icon:'key'}]
    :rol==='guarda_vehicular'    ? [{id:'home',label:'Inicio',icon:'home'},{id:'flota',label:'Flota',icon:'truck'},{id:'prov',label:'Proveedores',icon:'package'},{id:'visitavh',label:'Visita Vh.',icon:'truck'},{id:'visit',label:'Visitas',icon:'users'}]
    :rol==='recorredor_externo'  ? [{id:'home',label:'Inicio',icon:'home'},{id:'ronda',label:'Ronda',icon:'mapPin'},{id:'novedades',label:'Novedades',icon:'bell'}]
    :rol==='coordinador'         ? [{id:'home',label:'Inicio',icon:'home'},{id:'flota',label:'Flota',icon:'truck'},{id:'prov',label:'Proveedores',icon:'package'},{id:'acceso',label:'Acceso',icon:'userCheck'},{id:'visit',label:'Visitas',icon:'users'}]
    :[
      {id:'home',  label:'Inicio',  icon:'home'},
      {id:'flota', label:'Flota',   icon:'truck'},
      {id:'acceso',label:'Acceso',  icon:'userCheck'},
      {id:'visit', label:'Visitas', icon:'users'},
      {id:'reg',   label:'Reportes',icon:'fileText'},
    ];

  // Módulo Muelles (Fase 2, solo lectura): a diferencia del resto de
  // navItems -- fijos por rol en el bloque de arriba, que NO se toca --
  // este se agrega dinámicamente para cualquier rol con permiso
  // muelles:read (hoy: coordinador y guarda_bodega), sin tener que
  // enumerar roles a mano en cada rama del ternario.
  if(puede(user,'muelles','read') && !navItems.some(it=>it.id==='muelles')){
    navItems.push({id:'muelles',label:'Muelles',icon:'mapPin'});
  }

  // Módulo Citas (Fase 3, solo lectura): mismo patrón que Muelles arriba --
  // se agrega dinámicamente para cualquier rol con permiso citas:read, sin
  // enumerar roles a mano en el ternario fijo de navItems.
  if(puede(user,'citas','read') && !navItems.some(it=>it.id==='citas')){
    navItems.push({id:'citas',label:'Citas',icon:'calendar'});
  }

  const pageContent = {
    home:   h(HomePage,{setPage:navigate,user}),
    flota:  h(FlotaPage,{user,online,addOffline,openId:openFlotaId,onOpened:()=>setOpenFlotaId(null)}),
    prov:   h(ProveedoresPage,{user,online,addOffline}),
    visitavh: h(VisitaVehicularPage,{user,online,addOffline}),
    acceso: h(AccesoPage,{user,online,addOffline}),
    visit:  h(VisitantesPage,{user,online,addOffline}),
    sust:   h(ItemAccesoPage,{tipo:'sustancias',user}),
    herr:   h(ItemAccesoPage,{tipo:'herramientas',user}),
    bd:        h(BaseDatosPage,{user}),
    carga:     h(CargaMasivaPage,null),
    reg:       h(RegistrosPage,null),
    ronda:     h(RondaPage,{user}),
    novedades: h(NovedadesPage,{user}),
    rondapanel: h(RondaPanelPage,{user}),
    muelles: h(MuellesPage,{user}),
    citas:   h(CitasPage,{user}),
  };

  return h('div',{className:'app-wrap'},
    h('div',{className:'app-main'},
      h(AppHeader,{user,page,setPage:navigate,online,offlineQueue:queue.length,onAbrirFlota:(id)=>{setOpenFlotaId(id);navigate('flota');}}),
      queue.length>0&&online&&h('div',{className:'queue-banner'},
        h(Ico,{n:'wifi',s:14}),
        h('p',null,`${queue.length} registros pendientes de sincronizar`),
        h('button',{onClick:syncQueue},'Sincronizar ahora')
      ),
      pageContent[page]||pageContent['home'],
      h(BtnNovedad,{user,moduloActual:page})
    ),
    h('nav',{className:'bnav'},
      navItems.map(it=>h('button',{key:it.id,className:`nav-btn ${page===it.id?'act':''}`,onClick:()=>navigate(it.id)},
        page===it.id&&h('div',{className:'nav-dot'}),
        h(Ico,{n:it.icon,s:22}),
        h('span',null,it.label)
      ))
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
